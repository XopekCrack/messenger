<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Мессенджер</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* ---- Логин ---- */
  #auth { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 26px; gap: 8px; }
  #authForm { display: flex; flex-direction: column; gap: 8px; }
  #auth h1 { font-size: 16px; margin: 0 0 16px; text-align: center; font-weight: 700; }
  #auth input { -webkit-app-region: no-drag; width: 100%; padding: 10px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; color: var(--text); font-size: 13px; }
  #auth input:focus { outline: none; border-color: var(--accent); }
  #auth button.primary { -webkit-app-region: no-drag; margin-top: 8px; padding: 11px; border: none; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-weight: 700; cursor: pointer; font-size: 13px; }
  #auth .switch { -webkit-app-region: no-drag; text-align: center; color: var(--muted); cursor: pointer; margin-top: 6px; }
  #auth .switch:hover { color: var(--text); }
  #auth .err { color: var(--danger); text-align: center; min-height: 16px; font-size: 12px; }

  /* ---- Заголовок ---- */
  .wintitlebar .title { font-weight: 600; font-size: 12px; letter-spacing: .3px; display: flex; align-items: center; gap: 6px; flex-shrink: 0; -webkit-app-region: drag; }
  .wintitlebar .title .brand-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  /* ---- Ростер ---- */
  #app { display: none; flex: 1; flex-direction: column; min-height: 0; }
  #app.active { display: flex; }

  #me-bar, #searchBar { -webkit-app-region: no-drag; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--panel); min-height: 46px; }
  #me-bar { cursor: pointer; }
  #me-bar:hover { background: var(--panel-2); }
  #me-bar .chev { margin-left: auto; color: var(--muted); display: flex; flex-shrink: 0; transform: rotate(-90deg); }
  .avatar { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #8f6ee8); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700; flex-shrink: 0; position: relative; }
  .avatar .dot { position: absolute; right: -2px; bottom: -2px; border: 2px solid var(--panel); -webkit-app-region: no-drag; }
  #me-bar .name { font-weight: 600; font-size: 12.5px; }
  #me-bar .dot { margin-right: -2px; }

  #searchBar { display: none; }
  #searchBar.active { display: flex; }
  #searchBar svg { color: var(--muted); flex-shrink: 0; }
  #searchBar input { flex: 1; background: transparent; border: none; color: var(--text); font-size: 13px; }
  #searchBar input:focus { outline: none; }

  #list { flex: 1; overflow-y: auto; padding: 6px; }
  .section { padding: 10px 8px 6px 10px; display: flex; align-items: center; gap: 6px; cursor: pointer; border-radius: 6px; user-select: none; }
  .section .chev { color: var(--muted); display: flex; transition: transform .15s; flex-shrink: 0; }
  .section.collapsed .chev { transform: rotate(-90deg); }
  .section .stitle { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 700; }
  .section .scount { font-size: 10.5px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .dept-rows.collapsed { display: none; }

  .row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; cursor: pointer; transition: background .12s; }
  .row:hover { background: var(--panel-2); }
  .row .n { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .row .me-tag { font-weight: 500; font-size: 10.5px; color: var(--muted); display: none; }
  .row.is-me:hover .me-tag { display: inline; }
  .row.is-me { background: var(--panel-2); }
  .row.is-me:hover { background: var(--hover); }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--offline); flex-shrink: 0; }
  .dot.active { background: var(--online); box-shadow: 0 0 6px 0 var(--online); }
  .dot.idle { background: var(--afk); box-shadow: 0 0 6px 0 var(--afk); }
  .badge-icon { width: 26px; height: 26px; border-radius: 8px; background: var(--panel-2); color: var(--accent-2); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .empty-hint { padding: 20px 12px; text-align: center; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<div class="wintitlebar">
  <span class="title"><span class="brand-dot"></span>Мессенджер</span>
  <div class="wctl">
    <button class="icon-btn" id="wcMin"></button>
    <button class="icon-btn" id="wcMax"></button>
    <button class="icon-btn close" id="wcClose"></button>
  </div>
</div>

<div id="auth">
  <h1>Вход в мессенджер</h1>
  <div class="err" id="authErr"></div>
  <form id="authForm" onsubmit="event.preventDefault(); doAuth();">
    <input id="username" placeholder="Логин">
    <input id="password" type="password" placeholder="Пароль">
    <button class="primary" type="submit">Войти</button>
  </form>
  <div class="switch" id="switchMode" onclick="toggleMode()">Нет аккаунта? Зарегистрироваться</div>
</div>

<div id="app">
  <div id="me-bar">
    <div class="avatar" id="meAvatar"><span class="dot active" id="meDot" title="В сети"></span></div>
    <div class="name" id="meName"></div>
    <span class="chev"></span>
  </div>
  <div id="searchBar"></div>
  <div id="list"></div>
</div>

<script src="ui-kit.js"></script>
<script>
let token = localStorage.getItem('token');
let me = JSON.parse(localStorage.getItem('me') || 'null');
let serverUrl = ''; // подтягивается из config.js через главный процесс — см. init() внизу файла
let mode = 'login';
let ws, presence = {}, usersCache = [];
let collapsedDepts = new Set(JSON.parse(localStorage.getItem('collapsedDepts') || '[]'));
let searchQuery = '';

function initials(name) { return (name || '?').slice(0, 2).toUpperCase(); }
function displayNameOf(u) { return u.display_name || u.username; }

function toggleMode() {
  mode = mode === 'login' ? 'register' : 'login';
  document.querySelector('#auth button.primary').textContent = mode === 'login' ? 'Войти' : 'Зарегистрироваться';
  document.getElementById('switchMode').textContent = mode === 'login' ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
}

async function doAuth() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('authErr');
  errEl.textContent = '';
  try {
    const res = await fetch(`${serverUrl}/api/${mode}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Ошибка'; return; }
    token = data.token; me = data.user;
    localStorage.setItem('token', token);
    localStorage.setItem('me', JSON.stringify(me));
    startApp();
  } catch {
    errEl.textContent = 'Сервер недоступен. Обратитесь к администратору';
  }
}

async function api(path, opts) {
  const res = await fetch(serverUrl + path, {
    ...opts,
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts?.headers || {}) },
  });
  if (res.status === 401) { desktop.logout(); throw new Error('Сессия недействительна'); }
  if (!res.ok) throw new Error('request failed');
  return res.json();
}

function connectWs() {
  const wsUrl = serverUrl.replace(/^http/, 'ws');
  ws = new WebSocket(`${wsUrl}?token=${token}&host=${encodeURIComponent(desktop.hostname)}`);
  // Реальный статус на момент подключения, а не всегда "в сети" — иначе новое WS-подключение
  // (например, при открытии окна чата) на пару секунд перебивало настоящий AFK-статус человека,
  // пока не придёт очередной 15-секундный тик с исправлением.
  ws.onopen = async () => {
    const { state } = await desktop.getIdleState();
    ws.send(JSON.stringify({ type: 'status', state }));
  };
  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'presence') { presence = data.users; updatePresenceOnly(); }
    if (data.type === 'message' && data.from_id !== me.id) {
      const files = data.files || [];
      let body = data.text || '';
      if (files.length === 1) body = body ? `${body} · 📎 ${files[0].name}` : `📎 ${files[0].name}`;
      else if (files.length > 1) body = body ? `${body} · 📎 ${files.length} файла` : `📎 ${files.length} файла`;
      desktop.notify({
        title: data.from_user,
        body,
        openPayload: { type: data.room ? 'room' : 'dm', id: data.room || data.from_id, label: data.from_user, token, serverUrl },
      });
    }
    if (data.type === 'broadcast') {
      desktop.notify({
        title: '📢 Рассылка от ' + data.from_user,
        body: data.text || `📎 ${(data.files || []).length} файл(ов)`,
        openPayload: { type: 'broadcast', id: 'broadcast', label: 'История рассылок', token, serverUrl, file: 'broadcast.html' },
      });
    }
    // Админ поменял чью-то роль/отдел/список пользователей — подхватываем сразу, без перезахода
    if (data.type === 'users-changed') { refreshUsers(); refreshMe(); }
  };
  ws.onclose = () => setTimeout(connectWs, 2000);
}

// Текст статуса: для "отошёл" — сколько времени человек уже отошёл, а не просто "AFK"
function formatIdleDuration(idleSince) {
  if (!idleSince) return '';
  const mins = Math.max(1, Math.round((Date.now() - idleSince) / 60000));
  if (mins < 60) return `${mins} мин назад`;
  const hours = Math.floor(mins / 60);
  return `${hours} ч назад`;
}
function statusLabel(state, idleSince) {
  if (state === 'active') return 'В сети';
  if (state === 'idle') return `Отошёл (${formatIdleDuration(idleSince)})`;
  return 'Не в сети';
}
// Тултип строки пользователя: "Статус: ..." + по строке "Имя ПК: ..." на каждый подключённый
// компьютер (если несколько сессий на одном аккаунте).
function buildTooltip(state, idleSince, hosts) {
  const lines = [`Статус: ${statusLabel(state, idleSince)}`];
  (hosts || []).forEach((h) => lines.push(`Имя ПК: ${h}`));
  return lines.join('\n');
}

desktop.onIdleState(({ state, idleSeconds }) => {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'status', state }));
  const dot = document.getElementById('meDot');
  if (dot) {
    dot.className = 'dot ' + state;
    const mins = Math.floor((idleSeconds || 0) / 60);
    dot.title = state === 'idle' ? `Отошёл (${mins} мин назад)` : 'В сети';
  }
});

desktop.onShowAlert(({ message, title }) => uiAlert(message, title));

function deptOnlineCount(users) {
  const on = users.filter(u => { const s = (presence[u.id] || {}).state; return s === 'active' || s === 'idle'; }).length;
  return `${on}/${users.length}`;
}

function toggleDept(key) {
  if (collapsedDepts.has(key)) collapsedDepts.delete(key); else collapsedDepts.add(key);
  localStorage.setItem('collapsedDepts', JSON.stringify([...collapsedDepts]));
  renderList();
}

function makeUserRow(u) {
  const isMe = u.id === me.id;
  const p = presence[u.id] || { state: 'offline', hosts: [] };
  const name = displayNameOf(u);
  const chatPayload = { type: 'dm', id: u.id, label: name, token, serverUrl };
  const row = document.createElement('div');
  row.className = 'row' + (isMe ? ' is-me' : '');
  row.dataset.uid = u.id; // нужно для точечного обновления статуса без пересборки всего списка
  row.innerHTML = `<div class="dot ${p.state}"></div><div class="n">${name}${isMe ? ' <span class="me-tag">это вы</span>' : ''}</div>`;
  if (isMe) {
    row.title = 'Профиль и настройки';
    row.onclick = () => desktop.openProfile({ token, serverUrl, me: JSON.stringify(me) });
  } else {
    row.title = buildTooltip(p.state, p.idleSince, p.hosts);
    row.onclick = () => desktop.openChat(chatPayload);
    row.oncontextmenu = (e) => { e.preventDefault(); desktop.showUserMenu(chatPayload); };
  }
  return row;
}

// Точечно обновляет точки статуса/тултипы/счётчики "онлайн" по уже существующим DOM-узлам,
// НЕ пересоздавая их. Раньше presence-сообщение (а оно приходит при изменении статуса ЛЮБОГО
// пользователя, не только того, над кем сейчас курсор) вызывало renderList(), которая полностью
// сносит и заново строит список — если мышь в этот момент была над строкой, наведённый элемент
// уничтожался и на его месте появлялся новый уже без :hover, из-за чего подсветка периодически
// пропадала и снова появлялась (моргание). Теперь при обычном обновлении статуса элементы не
// трогаем вообще, только переставляем классы/текст внутри них.
function updatePresenceOnly() {
  document.querySelectorAll('#list .row[data-uid]').forEach((row) => {
    const u = usersCache.find((x) => String(x.id) === row.dataset.uid);
    if (!u) return;
    const p = presence[u.id] || { state: 'offline', hosts: [] };
    const dot = row.querySelector('.dot');
    if (dot) dot.className = 'dot ' + p.state;
    row.title = buildTooltip(p.state, p.idleSince, p.hosts);
  });
  document.querySelectorAll('#list .section[data-dept]').forEach((section) => {
    const key = section.dataset.dept;
    const users = usersCache.filter((u) => (u.department || 'Без отдела') === key);
    const countEl = section.querySelector('.scount');
    if (countEl) countEl.textContent = deptOnlineCount(users);
  });
}

function renderList() {
  const list = document.getElementById('list');
  list.innerHTML = '';

  const historyRow = document.createElement('div');
  historyRow.className = 'row';
  historyRow.title = 'Открыть ленту всех рассылок';
  historyRow.innerHTML = `<div class="badge-icon">${uiIcon('megaphone')}</div><div class="n">История рассылок</div>`;
  historyRow.onclick = () => desktop.openBroadcast({ token, serverUrl, me: JSON.stringify(me) });
  list.appendChild(historyRow);

  const allUsers = usersCache;

  // Поиск — плоский список без группировки по отделам, без учёта свёрнутости
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    const found = allUsers.filter(u => displayNameOf(u).toLowerCase().includes(q));
    if (!found.length) {
      const hint = document.createElement('div');
      hint.className = 'empty-hint';
      hint.textContent = 'Никого не найдено';
      list.appendChild(hint);
    } else {
      found.forEach(u => list.appendChild(makeUserRow(u)));
    }
    return;
  }

  const groups = new Map();
  allUsers.forEach(u => {
    const key = u.department || 'Без отдела';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(u);
  });

  // Порядок — как задан на сервере (веб-панель, стрелки ↑↓), "Без отдела" всегда в самом низу;
  // если отдела почему-то нет в списке с сервера (рассинхрон) — в конец, по алфавиту между собой.
  const orderedKeys = [...groups.keys()].sort((a, b) => {
    if (a === 'Без отдела') return 1;
    if (b === 'Без отдела') return -1;
    const ia = deptOrderCache.indexOf(a);
    const ib = deptOrderCache.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b, 'ru');
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });

  for (const key of orderedKeys) {
    const users = groups.get(key);
    const collapsed = collapsedDepts.has(key);
    const section = document.createElement('div');
    section.className = 'section' + (collapsed ? ' collapsed' : '');
    section.dataset.dept = key;
    section.title = collapsed ? 'Показать сотрудников отдела' : 'Скрыть сотрудников отдела';
    section.innerHTML = `<span class="chev">${uiIcon('chevron')}</span><span class="stitle">${key}</span><span class="scount">${deptOnlineCount(users)}</span>`;
    section.onclick = () => toggleDept(key);
    list.appendChild(section);

    const rowsWrap = document.createElement('div');
    rowsWrap.className = 'dept-rows' + (collapsed ? ' collapsed' : '');
    users.forEach(u => rowsWrap.appendChild(makeUserRow(u)));
    list.appendChild(rowsWrap);
  }
}

let deptOrderCache = []; // имена отделов в порядке, заданном на сервере (стрелками ↑↓ в веб-панели)

async function refreshUsers() {
  usersCache = await api('/api/users');
  try { deptOrderCache = (await api('/api/departments')).map((d) => d.name); } catch { /* не критично — останется прошлый порядок или алфавитный */ }
  renderList();
}

// Роль/имя могли поменять на сервере (через веб-панель) — подтягиваем свежие данные без перезахода
async function refreshMe() {
  try {
    const fresh = await api('/api/me');
    me = { ...me, ...fresh };
    localStorage.setItem('me', JSON.stringify(me));
    document.getElementById('meName').textContent = displayNameOf(me);
  } catch { /* сеть могла моргнуть — не критично, попробуем при следующем событии */ }
}

// ---------- Скрытый поиск: начал печатать — появилась строка поиска вместо "себя" ----------
function setSearchActive(active) {
  document.getElementById('me-bar').style.display = active ? 'none' : 'flex';
  const bar = document.getElementById('searchBar');
  bar.classList.toggle('active', active);
  if (active && !bar.dataset.built) {
    bar.dataset.built = '1';
    bar.innerHTML = `${uiIcon('search')}<input id="searchInput" placeholder="Поиск по имени...">`;
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      if (!searchQuery) setSearchActive(false);
      renderList();
    });
  }
  if (active) { bar.querySelector('input').value = searchQuery; bar.querySelector('input').focus(); }
}

document.addEventListener('keydown', (e) => {
  if (!document.getElementById('app').classList.contains('active')) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const active = document.activeElement;
  const typingElsewhere = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA') && active.id !== 'searchInput';
  if (typingElsewhere) return;

  if (e.key === 'Escape') { e.preventDefault(); searchQuery = ''; setSearchActive(false); renderList(); return; }
  if (e.key === 'Backspace') {
    e.preventDefault(); // иначе на пустом searchQuery Electron может воспринять Backspace как "назад"
    if (!searchQuery) return;
    searchQuery = searchQuery.slice(0, -1);
    if (!searchQuery) { setSearchActive(false); renderList(); return; }
    setSearchActive(true);
    renderList();
    return;
  }
  if (e.key.length === 1) { // печатный символ
    // Без этого браузер, увидев, что мы только что сфокусировали #searchInput (внутри
    // setSearchActive), сам ЕЩЁ РАЗ вставлял тот же символ в уже сфокусированное поле —
    // и на экране появлялось "аа" вместо "а".
    e.preventDefault();
    searchQuery += e.key;
    setSearchActive(true);
    renderList();
  }
});

async function startApp() {
  document.getElementById('auth').style.display = 'none';
  document.getElementById('app').classList.add('active');
  document.getElementById('meAvatar').prepend(initials(displayNameOf(me)));
  document.getElementById('meName').textContent = displayNameOf(me);
  document.querySelector('#me-bar .chev').innerHTML = uiIcon('chevron');
  document.getElementById('me-bar').onclick = () => desktop.openProfile({ token, serverUrl, me: JSON.stringify(me) });
  document.getElementById('me-bar').title = 'Профиль и настройки';
  await refreshUsers();
  connectWs();
  setInterval(refreshUsers, 20000);
}

(async function init() {
  serverUrl = await desktop.getServerUrl();
  if (token && me) startApp();
})();
</script>
</body>
</html>
